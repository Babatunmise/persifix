name: Ahuva verification

on:
  pull_request:
    branches: [main]
    paths:
      - "src/components/AhuvaKitchen.tsx"
      - "src/lib/ahuva-pot-math.mjs"
      - "src/lib/ahuva-pot-math.test.mjs"
      - "src/app/api/kitchen/route.ts"
      - "src/app/ahuva/**"
      - "src/app/kitchen/**"
      - "docs/ahuva/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ahuva-verify.yml"
  push:
    branches: [feature/ahuva-definitive-realignment]

permissions:
  contents: read

concurrency:
  group: ahuva-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Pot Math tests
        run: npm run test:ahuva
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npx eslint src/components/AhuvaKitchen.tsx src/components/BottomNav.tsx src/lib/ahuva-pot-math.mjs src/lib/ahuva-pot-math.test.mjs src/app/ahuva/page.tsx src/app/api/kitchen/route.ts src/app/kitchen/page.tsx
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
