name: HEP-002 validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "docs/security/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/hep-002-validation.yml"
  push:
    branches: ["hep-002/rate-limit-hardening"]

permissions:
  contents: read

jobs:
  application:
    name: Application lint, typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key-not-a-secret

  database:
    name: Isolated PostgreSQL migration and RPC tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hep002_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hep002_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration and verify security invariants
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d hep002_test -v ON_ERROR_STOP=1 -f supabase/tests/hep_002_rate_limit_hardening.sql
